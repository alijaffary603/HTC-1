[project]
name = "gridskills"
version = "0.1.0"
description = "Turns AESO connection data into regional job demand estimates by occupation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2", "numpy", "openpyxl", "pyarrow", "scikit-learn"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gridskills*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
